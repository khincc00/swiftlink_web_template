<!--
title: Gallery | SwiftLink Logistics &amp; Transport
description: Photos of the SwiftLink fleet, warehouse, operations and team at work across Singapore.
nav: gallery
-->
    <section class="page-hero page-hero-plain" aria-labelledby="page-title">
      <div class="container page-hero-inner">
        <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li aria-current="page">Gallery</li></ol></nav>
        <h1 id="page-title">Our operations in pictures</h1>
        <p>The fleet on the road, the warehouse floor and the teams who keep every job on schedule.</p>
      </div>
    </section>

    <!--
      GALLERY — filters and lightbox: initGallery in main.js.
      To add a photo: copy one <figure class="g-item">, set data-category to
      fleet | warehouse | operations | team, and optionally add "wide" (2 columns)
      or "tall" (2 rows). Counts on the filter buttons update automatically.
      To add a category, add a filter button with the same data-filter value.
      The figcaption's <small> label is turned into "Label · caption" in the viewer.
      Run _tools/optimize-images.sh after adding photos to create WebP copies.
    -->
    <section class="section" style="padding-top: clamp(2rem, 5vw, 3.5rem)" aria-label="Photo gallery">
      <div class="container">
        <div class="gallery-bar">
          <div class="gallery-filters" role="group" aria-label="Filter photos" data-gallery-filters>
            <button type="button" data-filter="all" aria-pressed="true">All <span></span></button>
            <button type="button" data-filter="fleet" aria-pressed="false">Fleet <span></span></button>
            <button type="button" data-filter="warehouse" aria-pressed="false">Warehouse <span></span></button>
            <button type="button" data-filter="operations" aria-pressed="false">Operations <span></span></button>
            <button type="button" data-filter="team" aria-pressed="false">Team <span></span></button>
          </div>
          <p class="gallery-count" aria-live="polite" data-gallery-count></p>
        </div>

        <div class="gallery-grid" data-gallery>
          <figure class="g-item wide tall" data-category="fleet"><button type="button" aria-label="Open photo: Daily deliveries through the city"><img src="assets/images/photos/truck-singapore-street.jpg" alt="Delivery truck travelling through a Singapore street" width="1400" height="935" loading="lazy"></button><figcaption><small>Fleet</small>Daily deliveries through the city</figcaption></figure>
          <figure class="g-item tall" data-category="fleet"><button type="button" aria-label="Open photo: Van loaded for parcel drop-offs"><img src="assets/images/photos/van-parcels.jpg" alt="Delivery van loaded with parcels" width="1400" height="2100" loading="lazy"></button><figcaption><small>Fleet</small>Van loaded for parcel drop-offs</figcaption></figure>
          <figure class="g-item" data-category="warehouse"><button type="button" aria-label="Open photo: Forklift operations"><img src="assets/images/photos/warehouse-forklift.jpg" alt="Forklift moving stock between warehouse racks" width="1400" height="1318" loading="lazy"></button><figcaption><small>Warehouse</small>Forklift operations</figcaption></figure>
          <figure class="g-item" data-category="team"><button type="button" aria-label="Open photo: Route planning"><img src="assets/images/photos/team-planning.jpg" alt="Operations team planning routes" width="1400" height="788" loading="lazy"></button><figcaption><small>Team</small>Route planning</figcaption></figure>
          <figure class="g-item wide" data-category="operations"><button type="button" aria-label="Open photo: Cargo pickups at the Port of Singapore"><img src="assets/images/photos/singapore-port.jpg" alt="Cargo terminal at the Port of Singapore" width="1400" height="933" loading="lazy"></button><figcaption><small>Operations</small>Cargo pickups at the Port of Singapore</figcaption></figure>
          <figure class="g-item tall" data-category="fleet"><button type="button" aria-label="Open photo: Driver on a charter job"><img src="assets/images/photos/chauffeur-driving.jpg" alt="Professional driver at the wheel of a charter vehicle" width="1400" height="2097" loading="lazy"></button><figcaption><small>Fleet</small>Driver on a charter job</figcaption></figure>
          <figure class="g-item" data-category="operations"><button type="button" aria-label="Open photo: Container yard from above"><img src="assets/images/photos/container-yard-aerial.jpg" alt="Aerial view of a shipping container yard" width="1400" height="933" loading="lazy"></button><figcaption><small>Operations</small>Container yard from above</figcaption></figure>
          <figure class="g-item" data-category="fleet"><button type="button" aria-label="Open photo: Executive transfer vehicle"><img src="assets/images/photos/executive-vehicle.jpg" alt="Executive vehicle for point-to-point transfers" width="1400" height="933" loading="lazy"></button><figcaption><small>Fleet</small>Executive transfer vehicle</figcaption></figure>
          <figure class="g-item wide" data-category="team"><button type="button" aria-label="Open photo: Planning session with a client"><img src="assets/images/photos/team-discussion.jpg" alt="SwiftLink team in a planning session with a client" width="1400" height="788" loading="lazy"></button><figcaption><small>Team</small>Planning session with a client</figcaption></figure>
          <figure class="g-item tall" data-category="fleet"><button type="button" aria-label="Open photo: Inter-site transfer"><img src="assets/images/photos/van-open-road.jpg" alt="Delivery van on an open road" width="1200" height="1800" loading="lazy"></button><figcaption><small>Fleet</small>Inter-site transfer</figcaption></figure>
          <figure class="g-item" data-category="team"><button type="button" aria-label="Open photo: Daily dispatch briefing"><img src="assets/images/photos/operations-meeting.jpg" alt="Dispatch team at a daily briefing" width="1400" height="934" loading="lazy"></button><figcaption><small>Team</small>Daily dispatch briefing</figcaption></figure>
          <figure class="g-item" data-category="operations"><button type="button" aria-label="Open photo: Containers awaiting collection"><img src="assets/images/photos/container-stacks.jpg" alt="Rows of shipping containers awaiting collection" width="1400" height="933" loading="lazy"></button><figcaption><small>Operations</small>Containers awaiting collection</figcaption></figure>
        </div>
      </div>
    </section>

    <!-- Full-screen viewer (keyboard: ← → Esc, swipe on touch screens) -->
    <div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" data-lightbox>
      <button class="lb-btn lb-close" type="button" aria-label="Close" data-lb-close>{{icon:close}}</button>
      <button class="lb-btn lb-prev" type="button" aria-label="Previous photo" data-lb-prev>{{icon:chev-left}}</button>
      <figure><img alt=""><figcaption><span data-lb-caption></span><span data-lb-count></span></figcaption></figure>
      <button class="lb-btn lb-next" type="button" aria-label="Next photo" data-lb-next>{{icon:chev-right}}</button>
    </div>
