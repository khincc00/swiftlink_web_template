<!doctype html>
<!--
  Social share image source (1200 × 630). Render it to assets/images/og-image.jpg
  with _tools/render-brand-assets.sh after changing the headline or photo.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: 'Roboto', Arial, sans-serif; color: #fff; background: #040E2E; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(4,14,46,.97) 0%, rgba(4,14,46,.88) 45%, rgba(6,21,65,.45) 100%); }
  .inner { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; }
  .brand strong { display: block; font-family: 'General Sans', 'Roboto', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; line-height: 1; }
  .brand small { display: block; margin-top: 6px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.65); }
  .eyebrow { margin-top: auto; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #7CC3E0; }
  h1 { margin: 18px 0 0; max-width: 15ch; font-family: 'General Sans', 'Roboto', sans-serif; font-weight: 600; font-size: 68px; line-height: 1.04; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #7CC3E0; }
  .foot { display: flex; gap: 28px; margin-top: 34px; font-size: 20px; color: rgba(255,255,255,.8); }
  .foot span + span::before { content: "·"; margin-right: 28px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <img class="bg" src="../../assets/images/photos/singapore-port.jpg" alt="">
  <div class="shade"></div>
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#fff"/><path d="M11 12.5 18.5 20 11 27.5" fill="none" stroke="#0A2463" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M19.5 12.5 27 20l-7.5 7.5" fill="none" stroke="#0A2463" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><strong>SwiftLink</strong><small>Logistics &amp; Transport</small></div>
    </div>
    <p class="eyebrow">LTA-licensed transport partner · Singapore</p>
    <h1>Goods and people, moved <em>on time</em>, island-wide.</h1>
    <p class="foot"><span>Instant quotes</span><span>Live tracking</span><span>24/7 dispatch</span></p>
  </div>
</body>
</html>
