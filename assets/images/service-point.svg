<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" role="img" aria-labelledby="title">
  <title id="title">Sedan travelling door-to-door between two locations</title>
  <rect width="480" height="300" fill="#EEF4FA"/>

  <!-- Map streets -->
  <g stroke="#DFEBF6" stroke-width="12">
    <path d="M0 60h480M0 150h480M120 0v300M260 0v300M390 0v300"/>
  </g>
  <rect x="32" y="246" width="416" height="6" rx="3" fill="#D2DEEA"/>

  <!-- Route -->
  <path d="M80 132C150 52 330 52 408 122" stroke="#247BA0" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 11"/>

  <!-- Pin A -->
  <path d="M80 70a24 24 0 0 1 24 24c0 19-24 42-24 42s-24-23-24-42a24 24 0 0 1 24-24z" fill="#247BA0"/>
  <circle cx="80" cy="94" r="11" fill="#FFFFFF"/>
  <text x="80" y="99" text-anchor="middle" fill="#247BA0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">A</text>

  <!-- Pin B -->
  <path d="M408 60a24 24 0 0 1 24 24c0 19-24 42-24 42s-24-23-24-42a24 24 0 0 1 24-24z" fill="#0A2463"/>
  <circle cx="408" cy="84" r="11" fill="#FFFFFF"/>
  <text x="408" y="89" text-anchor="middle" fill="#0A2463" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">B</text>

  <!-- Sedan -->
  <path d="M136 212c0-12 7-18 18-19l42-5 36-30c8-6 15-8 26-8h52c11 0 18 3 25 10l30 30 20 4c11 2 17 9 17 20v14c0 5-3 8-8 8H144c-5 0-8-3-8-8z" fill="#0A2463"/>
  <path d="M206 188l30-25c4-3 7-4 12-4h22v29z" fill="#9CCBE0"/>
  <path d="M278 159h24c6 0 9 1 13 5l24 24h-61z" fill="#9CCBE0"/>
  <rect x="136" y="210" width="246" height="6" fill="#247BA0"/>
  <rect x="374" y="200" width="10" height="7" rx="2" fill="#F6D27A"/>
  <rect x="136" y="200" width="7" height="9" rx="2" fill="#E05A5A"/>

  <circle cx="190" cy="236" r="25" fill="#EEF4FA"/>
  <circle cx="330" cy="236" r="25" fill="#EEF4FA"/>
  <circle cx="190" cy="236" r="19" fill="#04112F"/><circle cx="190" cy="236" r="8" fill="#E0E0E0"/>
  <circle cx="330" cy="236" r="19" fill="#04112F"/><circle cx="330" cy="236" r="8" fill="#E0E0E0"/>
</svg>
